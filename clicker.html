<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Joystick Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: lime;
      position: absolute;
      border-radius: 8px;
    }

    #joystick {
      position: absolute;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
      /* По ширине - по центру, по высоте - 3% от низа */
      left: 50%;
      transform: translateX(-50%);
    }

    #stick {
      position: absolute;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let playerX, playerY;
let speedX = 0, speedY = 0;
let dragging = false;
let joystickSize, stickSize;

// Сохраняем относительную позицию игрока при изменении размера
let playerRelativeX = 0.5; // 0.5 = центр по X (50%)
let playerRelativeY = 0.5; // 0.5 = центр по Y (50%)

// Функция для инициализации позиции игрока (только при загрузке)
function initPlayer() {
  // Начальная позиция по центру
  playerRelativeX = 0.5;
  playerRelativeY = 0.5;
  updatePlayerPosition();
}

// Функция для обновления позиции игрока на основе относительных координат
function updatePlayerPosition() {
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;
  
  // Преобразуем относительные координаты в абсолютные
  playerX = playerRelativeX * (screenWidth - 40); // 40 - ширина игрока
  playerY = playerRelativeY * (screenHeight - 40); // 40 - высота игрока
  
  // Ограничиваем значения
  playerX = Math.max(0, Math.min(screenWidth - 40, playerX));
  playerY = Math.max(0, Math.min(screenHeight - 40, playerY));
  
  // Обновляем абсолютную позицию
  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;
}

// Функция для настройки размера и позиции джойстика
function setupJoystick() {
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;
  const minDimension = Math.min(screenWidth, screenHeight);
  
  // Джойстик занимает 20% от меньшей стороны экрана
  joystickSize = minDimension * 0.2;
  
  // Стик занимает 40% от джойстика
  stickSize = joystickSize * 0.4;
  
  // Устанавливаем размеры
  joystick.style.width = `${joystickSize}px`;
  joystick.style.height = `${joystickSize}px`;
  
  stick.style.width = `${stickSize}px`;
  stick.style.height = `${stickSize}px`;
  
  // Позиционируем стик по центру джойстика
  const stickOffset = (joystickSize - stickSize) / 2;
  stick.style.left = `${stickOffset}px`;
  stick.style.top = `${stickOffset}px`;
  
  // Позиционируем джойстик (центр по ширине, 3% от низа)
  const joystickBottom = screenHeight * 0.03 + joystickSize / 2;
  joystick.style.bottom = `${joystickBottom}px`;
}

// Обработчики событий
joystick.addEventListener("pointerdown", (e) => {
  dragging = true;
  e.preventDefault();
  updateStickPosition(e);
});

document.addEventListener("pointerup", () => {
  if (dragging) {
    dragging = false;
    // Возвращаем стик в центр джойстика
    const stickOffset = (joystickSize - stickSize) / 2;
    stick.style.left = `${stickOffset}px`;
    stick.style.top = `${stickOffset}px`;
    speedX = 0;
    speedY = 0;
  }
});

document.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  updateStickPosition(e);
});

function updateStickPosition(e) {
  const rect = joystick.getBoundingClientRect();
  const joystickRadius = joystickSize / 2;
  const stickRadius = stickSize / 2;
  
  // Координаты относительно центра джойстика
  let x = e.clientX - rect.left - joystickRadius;
  let y = e.clientY - rect.top - joystickRadius;
  
  // Ограничиваем радиус движения стика
  const maxDistance = joystickRadius - stickRadius;
  const distance = Math.sqrt(x*x + y*y);
  
  if (distance > maxDistance) {
    x = (x / distance) * maxDistance;
    y = (y / distance) * maxDistance;
  }
  
  // Позиционируем стик
  stick.style.left = `${joystickRadius + x - stickRadius}px`;
  stick.style.top = `${joystickRadius + y - stickRadius}px`;
  
  // Вычисляем скорость
  const normalizedX = x / maxDistance;
  const normalizedY = y / maxDistance;
  
  // Базовая скорость 5, но адаптированная к размеру экрана
  const baseSpeed = Math.max(window.innerWidth, window.innerHeight) * 0.005;
  speedX = normalizedX * baseSpeed;
  speedY = normalizedY * baseSpeed;
}

function gameLoop() {
  // Обновляем позицию игрока
  playerX += speedX;
  playerY += speedY;
  
  // Границы экрана
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;
  const maxX = screenWidth - 40;
  const maxY = screenHeight - 40;
  
  playerX = Math.max(0, Math.min(maxX, playerX));
  playerY = Math.max(0, Math.min(maxY, playerY));
  
  // Обновляем относительные координаты для сохранения позиции при ресайзе
  playerRelativeX = playerX / (screenWidth - 40 || 1); // Избегаем деления на 0
  playerRelativeY = playerY / (screenHeight - 40 || 1);
  
  // Обновляем абсолютную позицию
  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;
  
  requestAnimationFrame(gameLoop);
}

// Инициализация
function init() {
  initPlayer();
  setupJoystick();
  gameLoop();
}

window.addEventListener('load', init);

// При изменении размера окна обновляем только джойстик и позицию игрока
window.addEventListener('resize', () => {
  setupJoystick();
  updatePlayerPosition();
});
</script>

</body>
</html>
