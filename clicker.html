<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Joystick Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: lime;
      position: absolute;
    }

    #joystick {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
    }

    #stick {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let playerX, playerY, joystickX, joystickY;
let speedX = 0, speedY = 0;
let dragging = false;

// Функция для центрирования игрока и джойстика
function centerElements() {
  // Центрируем игрока по центру экрана
  playerX = window.innerWidth / 2 - 20; // -20, чтобы учесть размер игрока (40px)
  playerY = window.innerHeight / 2 - 20;

  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;

  // Центрируем джойстик по низу экрана
  joystickX = window.innerWidth / 2 - joystick.offsetWidth / 2;
  joystickY = window.innerHeight - joystick.offsetHeight - 40;

  joystick.style.left = `${joystickX}px`;
  joystick.style.top = `${joystickY}px`;
}

// Перезапуск центрации при изменении размеров экрана
window.addEventListener('resize', centerElements);

// Вызовем центрирование сразу при загрузке
centerElements();

let centerX = joystick.offsetWidth / 2;
let centerY = joystick.offsetHeight / 2;

// Обработчики событий
joystick.addEventListener("pointerdown", e => {
  dragging = true;
});

document.addEventListener("pointerup", e => {
  dragging = false;
  stick.style.left = "35px";
  stick.style.top = "35px";
  speedX = 0;
  speedY = 0;
});

document.addEventListener("pointermove", e => {
  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();
  let x = e.clientX - rect.left - centerX;
  let y = e.clientY - rect.top - centerY;

  const max = 40;
  const distance = Math.hypot(x, y);

  if (distance > max) {
    x = x / distance * max;
    y = y / distance * max;
  }

  stick.style.left = x + centerX - 25 + "px";
  stick.style.top = y + centerY - 25 + "px";

  speedX = x * 0.05;
  speedY = y * 0.05;
});

function gameLoop() {
  playerX += speedX;
  playerY += speedY;

  // Убедимся, что игрок не выходит за экран
  playerX = Math.max(0, Math.min(window.innerWidth - 40, playerX));
  playerY = Math.max(0, Math.min(window.innerHeight - 40, playerY));

  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
