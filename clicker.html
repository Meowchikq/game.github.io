<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Joystick Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: lime;
      position: absolute;
      border-radius: 8px;
    }

    #joystick {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
    }

    #stick {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let playerX, playerY;
let speedX = 0, speedY = 0;
let dragging = false;
let stickCenterX, stickCenterY;

// Функция для центрирования игрока
function centerPlayer() {
  playerX = window.innerWidth / 2 - 20;
  playerY = window.innerHeight / 2 - 20;

  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;
}

// Функция для центрирования джойстика
function centerJoystick() {
  // Джойстик всегда по центру экрана
  const joystickX = window.innerWidth / 2;
  const joystickY = window.innerHeight / 2;

  joystick.style.left = `${joystickX}px`;
  joystick.style.top = `${joystickY}px`;
  
  // Сохраняем центр джойстика
  stickCenterX = joystick.offsetWidth / 2;
  stickCenterY = joystick.offsetHeight / 2;
}

// Обработчики событий
joystick.addEventListener("pointerdown", e => {
  dragging = true;
  e.preventDefault();
});

document.addEventListener("pointerup", e => {
  if (dragging) {
    dragging = false;
    // Возвращаем стик в центр
    stick.style.left = "35px";
    stick.style.top = "35px";
    speedX = 0;
    speedY = 0;
  }
});

document.addEventListener("pointermove", e => {
  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();
  let x = e.clientX - rect.left - stickCenterX;
  let y = e.clientY - rect.top - stickCenterY;

  const max = 35;
  const distance = Math.hypot(x, y);

  if (distance > max) {
    x = x / distance * max;
    y = y / distance * max;
  }

  stick.style.left = x + stickCenterX - 25 + "px";
  stick.style.top = y + stickCenterY - 25 + "px";

  // Скорость зависит от положения стика
  speedX = x * 0.15;
  speedY = y * 0.15;
});

function gameLoop() {
  // Обновляем позицию игрока
  playerX += speedX;
  playerY += speedY;

  // Границы экрана с учетом размера игрока
  const maxX = window.innerWidth - 40;
  const maxY = window.innerHeight - 40;

  playerX = Math.max(0, Math.min(maxX, playerX));
  playerY = Math.max(0, Math.min(maxY, playerY));

  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;

  requestAnimationFrame(gameLoop);
}

// Инициализация
window.addEventListener('load', () => {
  centerPlayer();
  centerJoystick();
  gameLoop();
});

window.addEventListener('resize', () => {
  centerPlayer();
  centerJoystick();
});
</script>

</body>
</html>
