<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Joystick Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: lime;
      position: absolute;
      border-radius: 8px;
    }

    #joystick {
      position: absolute;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
      /* Центрируем через JS */
    }

    #stick {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let playerX, playerY;
let speedX = 0, speedY = 0;
let dragging = false;
let joystickCenterX, joystickCenterY;

// Функция для центрирования игрока
function centerPlayer() {
  playerX = window.innerWidth / 2 - 20;
  playerY = window.innerHeight / 2 - 20;

  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;
}

// Функция для центрирования джойстика
function centerJoystick() {
  // Центр экрана минус половина ширины/высоты джойстика
  joystickCenterX = window.innerWidth / 2;
  joystickCenterY = window.innerHeight / 2;
  
  joystick.style.left = `${joystickCenterX - joystick.offsetWidth/2}px`;
  joystick.style.top = `${joystickCenterY - joystick.offsetHeight/2}px`;
}

// Обработчики событий
joystick.addEventListener("pointerdown", (e) => {
  dragging = true;
  e.preventDefault();
  // Начинаем с текущей позиции касания
  updateStickPosition(e);
});

document.addEventListener("pointerup", () => {
  if (dragging) {
    dragging = false;
    // Возвращаем стик в центр джойстика
    stick.style.left = "35px";
    stick.style.top = "35px";
    speedX = 0;
    speedY = 0;
  }
});

document.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  updateStickPosition(e);
});

function updateStickPosition(e) {
  const rect = joystick.getBoundingClientRect();
  const joystickRadius = joystick.offsetWidth / 2;
  const stickRadius = stick.offsetWidth / 2;
  
  // Координаты относительно центра джойстика
  let x = e.clientX - rect.left - joystickRadius;
  let y = e.clientY - rect.top - joystickRadius;
  
  // Ограничиваем радиус движения стика
  const maxDistance = joystickRadius - stickRadius;
  const distance = Math.sqrt(x*x + y*y);
  
  if (distance > maxDistance) {
    x = (x / distance) * maxDistance;
    y = (y / distance) * maxDistance;
  }
  
  // Позиционируем стик
  stick.style.left = `${joystickRadius + x - stickRadius}px`;
  stick.style.top = `${joystickRadius + y - stickRadius}px`;
  
  // Вычисляем скорость (нормализованное значение от -1 до 1)
  const normalizedX = x / maxDistance;
  const normalizedY = y / maxDistance;
  
  speedX = normalizedX * 5; // Скорость умноженная на коэффициент
  speedY = normalizedY * 5;
}

function gameLoop() {
  // Обновляем позицию игрока
  playerX += speedX;
  playerY += speedY;
  
  // Границы экрана
  const maxX = window.innerWidth - 40;
  const maxY = window.innerHeight - 40;
  
  playerX = Math.max(0, Math.min(maxX, playerX));
  playerY = Math.max(0, Math.min(maxY, playerY));
  
  player.style.left = `${playerX}px`;
  player.style.top = `${playerY}px`;
  
  requestAnimationFrame(gameLoop);
}

// Инициализация
function init() {
  centerPlayer();
  centerJoystick();
  gameLoop();
}

window.addEventListener('load', init);
window.addEventListener('resize', () => {
  centerPlayer();
  centerJoystick();
});
</script>

</body>
</html>
