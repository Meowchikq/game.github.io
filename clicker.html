<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Joystick Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #player {
      width: 40px;
      height: 40px;
      background: lime;
      position: absolute;
      top: 200px;
      left: 200px;
      border-radius: 8px;
    }

    #joystick {
      position: absolute;
      display: flex;
      justify-content: center;
      bottom: 40px;
      left: 40px;
      width: 120px;
      height: 120px;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      touch-action: none;
    }

    #stick {
      width: 50px;
      height: 50px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      position: absolute;
      top: 35px;
      left: 35px;
    }
  </style>
</head>
<body>

<div id="game">
  <div id="player"></div>

  <div id="joystick">
    <div id="stick"></div>
  </div>
</div>

<script>
const player = document.getElementById("player");
const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let playerX = 1;
let playerY = 200;

let centerX = joystick.offsetWidth / 2;
let centerY = joystick.offsetHeight / 2;

let dragging = false;
let speedX = 0;
let speedY = 0;

joystick.addEventListener("pointerdown", e => {
  dragging = true;
});

document.addEventListener("pointerup", e => {
  dragging = false;
  stick.style.left = "35px";
  stick.style.top = "35px";
  speedX = 0;
  speedY = 0;
});

document.addEventListener("pointermove", e => {
  if (!dragging) return;

  const rect = joystick.getBoundingClientRect();
  let x = e.clientX - rect.left - centerX;
  let y = e.clientY - rect.top - centerY;

  const max = 40;
  const distance = Math.hypot(x, y);

  if (distance > max) {
    x = x / distance * max;
    y = y / distance * max;
  }

  stick.style.left = x + centerX - 25 + "px";
  stick.style.top = y + centerY - 25 + "px";

  speedX = x * 0.1;
  speedY = y * 0.1;
});

function gameLoop() {
  playerX += speedX;
  playerY += speedY;

  player.style.left = playerX + "px";
  player.style.top = playerY + "px";

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
